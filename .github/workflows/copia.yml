name: Copia de seguridad
on:
  schedule:
    - cron: '0 3 * * *' # cada noche a las 3:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exigir clave de cifrado
        run: test -n "$COPIA_CLAVE" || { echo 'Falta COPIA_CLAVE'; exit 1; }
        env:
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
      - run: npm install --no-save @upstash/redis@1.39.0
      - run: node scripts/copia.mjs
        env:
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_id }}
          path: |
            copia.json.enc
            copia-resumen.json
          if-no-files-found: error
          retention-days: 90
      - name: Avisar de copia fallida
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          etiqueta=copia-fallida
          fecha=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          cuerpo="Copia fallida el $fecha. Ejecución: $RUN_URL"
          if ! gh label list --limit 1000 --json name --jq '.[].name' | grep -Fxq "$etiqueta"; then
            gh label create "$etiqueta" --color B60205 --description 'Fallo de la copia de seguridad'
          fi
          issue=$(gh issue list --state open --label "$etiqueta" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$cuerpo"
          else
            gh issue create --title "Copia fallida: $fecha" --label "$etiqueta" --body "$cuerpo"
          fi
