name: Pruebas
# Cada PR y cada cambio en main: los tests y la compilación (lo mismo que hace Vercel antes de desplegar).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # La misma que Vercel en producción (nodejs24.x).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: npx next build
