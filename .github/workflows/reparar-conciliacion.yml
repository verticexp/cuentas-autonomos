name: Reparar conciliación bancaria
# Manual. Copia cifrada previa (punto de restauración) → simulación → aplicar (scripts/reparar-conciliacion.mjs).
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Escribir en la base de datos (si no, solo simula)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reparar:
    runs-on: ubuntu-latest
    env:
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save
      - name: Copia cifrada previa
        run: node scripts/copia.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: antes-de-reparar-${{ github.run_id }}
          path: |
            copia.json.enc
            copia-resumen.json
          if-no-files-found: error
          retention-days: 90
      - name: Simular
        run: node --import ./tests/apoyo/cargador.mjs scripts/reparar-conciliacion.mjs
      - name: Aplicar
        if: ${{ inputs.aplicar }}
        run: node --import ./tests/apoyo/cargador.mjs scripts/reparar-conciliacion.mjs --aplicar
