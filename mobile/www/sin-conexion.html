<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Fisquo</title>
<!--
  Pantalla de la app de iOS cuando no hay conexión (server.errorPath de capacitor.config.json; va dentro de la app).
  Al abrirla sin red sale la misma animación de inicio que la web (components/Arranque.js, app/diseno.css), y después,
  en vez de entrar, el logo sube y aparece el aviso con lo que hay que hacer, como las apps de Apple. Fisquo se abre sola
  en cuanto vuelve la conexión: lo vigila la app (NWPathMonitor en FisquoViewController.swift) y esta página también.
  Si se llega aquí con la app ya abierta (se pierde la red al recargar), el aviso sale sin repetir la animación.
-->
<style>
  :root { --verde: #0F1F1B; --crema: #FAFAF8; --menta: #86c9ab; --curva: cubic-bezier(0.32, 0.72, 0, 1); --salida: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--verde); color: var(--crema); }
  body { font: 17px/1.35 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .escena { position: fixed; inset: 0; display: grid; place-items: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  .centro { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 360px; transform: translateY(var(--sube, 0)); transition: transform 0.6s var(--curva); }
  .logo { display: block; width: min(70vw, 285px); height: auto; overflow: visible; transition: width 0.6s var(--curva); }

  /* La animación de inicio, la misma que la de la web (app/diseno.css, .arr-logo). */
  .logo .logo-n { animation: f 0.65s var(--curva) 0.78s both; }
  .logo .logo-trazo { stroke-width: 9; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: dibujo 0.65s cubic-bezier(0.65, 0, 0.35, 1) 0.05s forwards, apaga 0.3s var(--salida) 0.7s forwards; }
  .logo .logo-f { opacity: 0; animation: aparece 0.4s var(--salida) 0.55s forwards; }
  .logo .logo-l { opacity: 0; animation: letra 0.5s var(--salida) calc(0.95s + var(--i) * 0.05s) forwards; }
  .logo .logo-cola { transform-box: fill-box; transform-origin: center bottom; transform: scaleY(0); animation: cola 0.4s var(--salida) 1.3s forwards; }
  @keyframes f { from { transform: translateX(1351px); } }
  @keyframes dibujo { to { stroke-dashoffset: 0; } }
  @keyframes apaga { to { opacity: 0; } }
  @keyframes aparece { to { opacity: 1; } }
  @keyframes letra { from { opacity: 0; transform: translateX(-70px); } to { opacity: 1; transform: none; } }
  @keyframes cola { to { transform: none; } }
  .barra { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); width: 96px; height: 2px; margin-left: -48px; border-radius: 2px; overflow: hidden; background: rgba(250, 250, 248, 0.12); opacity: 0; animation: aparece 0.4s var(--salida) 0.35s forwards; transition: opacity 0.3s var(--salida); }
  .barra i { display: block; width: 40%; height: 100%; border-radius: inherit; background: var(--menta); animation: busca 1.1s ease-in-out infinite; }
  @keyframes busca { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* Ya visto (la app estaba abierta) o sin animaciones: el logo quieto. */
  html.quieto .logo *, html.quieto .barra { animation: none !important; }
  html.quieto .logo .logo-trazo { opacity: 0; }
  html.quieto .logo .logo-f, html.quieto .logo .logo-l { opacity: 1; }
  html.quieto .logo .logo-cola { transform: none; }
  html.quieto .barra { opacity: 0; }

  /* El aviso: el logo sube y se hace pequeño, y debajo aparece lo que pasa y qué hacer (como ContentUnavailableView). */
  html.aviso .centro { --sube: -6vh; }
  html.aviso .logo { width: min(40vw, 150px); }
  html.aviso .barra { animation: none; opacity: 0; }
  .texto { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 44px; opacity: 0; transform: translateY(12px); visibility: hidden; transition: opacity 0.45s var(--salida) 0.15s, transform 0.6s var(--curva) 0.1s, visibility 0s 0.6s; }
  html.aviso .texto { opacity: 1; transform: none; visibility: visible; transition-delay: 0.15s, 0.1s, 0s; }
  .icono { width: 44px; height: 44px; margin-bottom: 14px; fill: none; stroke: var(--menta); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icono .punto { fill: var(--menta); stroke: none; }
  .icono .corte { stroke: var(--verde); stroke-width: 5; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 30ch; color: rgba(250, 250, 248, 0.68); font-size: 15px; }
  button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 160px; min-height: 50px; margin-top: 28px; padding: 0 26px; border: 0; border-radius: 25px; background: var(--crema); color: var(--verde); font: inherit; font-weight: 600; cursor: pointer; transition: transform 0.15s var(--salida), opacity 0.2s; }
  button:active { transform: scale(0.96); opacity: 0.85; }
  button:focus-visible { outline: 2px solid var(--menta); outline-offset: 3px; }
  .gira { display: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(15, 31, 27, 0.25); border-top-color: var(--verde); animation: gira 0.8s linear infinite; }
  html.probando .gira { display: block; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .estado { min-height: 20px; margin-top: 14px; font-size: 13px; color: rgba(250, 250, 248, 0.5); }
  html.niega button { animation: niega 0.4s var(--salida); }
  @keyframes niega { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  /* Vuelve la red: todo se funde y queda el verde, desde el que entra Fisquo con su animación de inicio (la de la web). */
  html.vuelve .centro, html.vuelve .barra { animation: none; opacity: 0; transition: opacity 0.25s var(--salida); }
  @media (prefers-reduced-motion: reduce) { .centro, .logo, .texto { transition: none; } .gira { animation-duration: 2s; } }
</style>
<script>
  // Primera vez en esta apertura de la app: con animación. Después (otra caída de la red), sin repetirla.
  try { if (sessionStorage.getItem('fisquo-sin-red') || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('quieto'); sessionStorage.setItem('fisquo-sin-red', '1'); } catch (e) {}
</script>

<script>
(function () {
  var html = document.documentElement;
  var lengua = (navigator.language || 'es').slice(0, 2);
  var T = {
    es: ['Sin conexión a internet', 'Desactiva el modo Avión o conéctate a una red Wi‑Fi o de datos. Fisquo se abrirá sola en cuanto vuelva la conexión.', 'Reintentar', 'Conectando…', 'Sigue sin haber conexión'],
    ca: ['Sense connexió a internet', "Desactiva el mode Avió o connecta't a una xarxa Wi‑Fi o de dades. Fisquo s'obrirà sola tan bon punt torni la connexió.", 'Tornar-ho a provar', 'Connectant…', 'Encara no hi ha connexió'],
    en: ['No internet connection', 'Turn off Airplane Mode or connect to Wi‑Fi or mobile data. Fisquo will open as soon as the connection is back.', 'Try again', 'Connecting…', 'Still no connection']
  };
  if (!T[lengua]) lengua = 'es';
  var t = T[lengua];
  html.lang = lengua;
  document.getElementById('t').textContent = t[0];
  document.getElementById('d').textContent = t[1];
  document.getElementById('rt').textContent = t[2];
  var estado = document.getElementById('e');
  var boton = document.getElementById('r');
  var nativo = window.webkit && window.webkit.messageHandlers;
  var servidor = String(window.fisquoServidor || 'https://www.fisquo.com/').replace(/\/+$/, '');
  var vibra = function (tipo) { try { nativo.haptica.postMessage(tipo); } catch (e) {} };

  // ¿Responde Fisquo? Una petición pequeña, sin caché; sin red falla al momento.
  var probar = function (ms) {
    return new Promise(function (ok) {
      var fin = setTimeout(function () { ok(false); }, ms);
      fetch(servidor + '/icon1.svg?r=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
        .then(function () { clearTimeout(fin); ok(true); }, function () { clearTimeout(fin); ok(false); });
    });
  };
  var entrando = false;
  var entrar = function () {
    if (entrando) return;
    entrando = true;
    html.classList.add('vuelve');
    // La app vuelve a la pantalla que no pudo abrir (FisquoViewController.swift); sin ella (una versión anterior), al inicio.
    setTimeout(function () {
      try { nativo.conexion.postMessage('volver'); } catch (e) { location.replace(servidor + '/'); }
    }, 220);
  };
  window.fisquoVuelveLaRed = entrar;

  // Tras la animación (o al momento, si ya se vio), si sigue sin red, el aviso; si la red ya está, se entra.
  var espera = html.classList.contains('quieto') ? 0 : 1750;
  var inicio = Date.now();
  probar(espera ? 2500 : 1500).then(function (hay) {
    if (hay) return entrar();
    setTimeout(function () { if (!entrando) html.classList.add('aviso'); }, Math.max(0, espera - (Date.now() - inicio)));
  });

  boton.addEventListener('click', function () {
    if (html.classList.contains('probando')) return;
    vibra('toque');
    html.classList.add('probando'); html.classList.remove('niega');
    document.getElementById('rt').textContent = t[3];
    estado.textContent = '';
    var desde = Date.now();
    probar(8000).then(function (hay) {
      setTimeout(function () {
        html.classList.remove('probando');
        document.getElementById('rt').textContent = t[2];
        if (hay) return entrar();
        vibra('error');
        void boton.offsetWidth; html.classList.add('niega');
        estado.textContent = t[4];
      }, Math.max(0, 600 - (Date.now() - desde)));
    });
  });

  // Por si la app no lo avisa: al volver la red o al volver a la app, se comprueba sola.
  var comprobar = function () { if (!entrando && !html.classList.contains('probando')) probar(4000).then(function (hay) { if (hay) entrar(); }); };
  window.addEventListener('online', comprobar);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') comprobar(); });
  setInterval(function () { if (document.visibilityState === 'visible') comprobar(); }, 5000);
})();
</script>
